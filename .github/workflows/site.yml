name: Refresh feeds and deploy

# One workflow for the whole site:
#   - on push: check index.html matches data/, then deploy what's in main
#   - daily and on demand: refresh data/feeds.json (Medium posts, YouTube videos and views,
#     GitHub stars) with scripts/build_content.py, re-render the Projects and Writing blocks,
#     commit if anything changed, then deploy.
# No API keys: the feeds are public RSS/Atom and stars come from the public GitHub API.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Refresh feeds and render
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_content.py --fetch

      # Views are rounded down (8K+, 500+), so most days nothing changes and nothing is committed.
      # Scheduled workflows stop after 60 days without a commit, so push an empty one at 50 days.
      - name: Commit changes
        run: |
          git config user.name akarce
          git config user.email 39713866+akarce@users.noreply.github.com
          git add index.html data/feeds.json assets/yt
          if ! git diff --cached --quiet; then
            git commit -m "chore(site): refresh feeds"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            git commit --allow-empty -m "chore(site): keep the daily feed refresh active"
            git push
          else
            echo "No changes"
          fi

  deploy:
    needs: refresh
    # Runs after a refresh, and on pushes (where refresh is skipped). A feed outage never blocks it.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Check out the tip of main, not the event SHA, so a feed commit made a minute ago ships too.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # The page's meta CSP allows the one inline script by its hash. If someone edits that
      # script without updating the hash, the saved theme silently stops applying, so fail here.
      - name: Check the CSP hash matches the inline script
        run: |
          python3 - <<'PY'
          import base64, hashlib, re, sys
          html = open("index.html", encoding="utf-8").read()
          m = re.search(r'http-equiv="Content-Security-Policy" content="([^"]+)"', html)
          if not m:
              sys.exit("CSP meta tag not found in index.html")
          csp = m.group(1)
          # Inline scripts only: skip src= scripts and JSON data blocks, which CSP doesn't govern.
          scripts = [s.group(2) for s in re.finditer(r"<script(\s[^>]*)?>(.*?)</script>", html, re.S)
                     if not re.search(r"\bsrc=|application/(ld\+)?json", s.group(1) or "")]
          missing = []
          for body in scripts:
              digest = base64.b64encode(hashlib.sha256(body.encode("utf-8")).digest()).decode()
              if f"'sha256-{digest}'" not in csp:
                  missing.append(digest)
          if missing:
              sys.exit(f"CSP is missing script hashes: {missing}")
          print(f"CSP hashes OK for {len(scripts)} inline script(s)")
          PY

      # index.html's Projects and Writing blocks are generated; a hand edit there would be
      # overwritten by the next refresh, so catch it before it ships.
      - name: Check generated blocks match data/
        run: python3 scripts/build_content.py --check

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html favicon.svg robots.txt sitemap.xml llms.txt .nojekyll Ceyhun_Akar_CV.pdf _site/
          cp -R assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
